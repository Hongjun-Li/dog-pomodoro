<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>双人学习小狗番茄钟</title>
  <style>
    :root{
      --bg:#fff8ef; --panel:#fff; --line:#eadfce; --text:#2c2a27; --muted:#7b746b;
      --accent:#ff9d66; --green:#7fc8a9; --shadow:0 12px 30px rgba(93,70,44,.10);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; color:var(--text);
      font-family:ui-rounded,"SF Pro Rounded","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
      background:
        radial-gradient(circle at 20% 10%,#ffe3cd 0 90px,transparent 91px),
        radial-gradient(circle at 80% 15%,#fff0a8 0 70px,transparent 71px),
        var(--bg);
    }
    .app{max-width:1400px;margin:auto;padding:28px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
    .brand h1{margin:0;font-size:28px}
    .brand p{margin:6px 0 0;color:var(--muted);font-size:14px}
    .status{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:white;font-size:13px}
    .dot{width:9px;height:9px;border-radius:50%;background:#c8c2ba}
    .dot.online{background:#54b98c}.dot.error{background:#e56b6b}
    button,input{font:inherit}
    button{border:0;border-radius:12px;padding:10px 14px;cursor:pointer;background:#f6eee5;color:var(--text)}
    button.primary{background:var(--accent);color:#fff;font-weight:700}
    button.green{background:var(--green);color:#fff;font-weight:700}
    button:disabled{opacity:.45;cursor:not-allowed}

    .gate-wrap{min-height:72vh;display:grid;place-items:center}
    .gate{
      width:min(440px,100%);background:rgba(255,255,255,.92);border:1px solid var(--line);
      border-radius:26px;padding:28px;box-shadow:var(--shadow);text-align:center
    }
    .gate-dog{font-size:56px;margin-bottom:8px}
    .gate h2{margin:0 0 8px;font-size:25px}
    .gate p{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.6}
    .gate .room{display:inline-block;margin-bottom:16px;padding:7px 11px;background:#fff7d8;border:1px solid #f1dfa4;border-radius:999px;font-size:13px}
    .gate input{
      width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:13px;outline:none;margin-bottom:10px
    }
    .gate input:focus{border-color:var(--accent)}
    .gate button{width:100%;padding:12px}
    .gate-error{min-height:20px;margin-top:10px;color:#c44;font-size:13px}

    .board{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    .user{background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow);min-width:0}
    .user-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
    .identity{display:flex;align-items:center;gap:12px;min-width:0}
    .avatar{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:#fff1e7;border:1px solid var(--line);font-size:30px}
    .name-wrap input{width:100%;border:0;border-bottom:1px dashed transparent;background:transparent;font-size:20px;font-weight:800;outline:none}
    .name-wrap input:focus{border-bottom-color:var(--accent)}
    .sub{font-size:12px;color:var(--muted);margin-top:4px}
    .grid{display:grid;grid-template-columns:1.05fr .95fr;gap:14px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
    .card h3{margin:0 0 12px;font-size:16px}
    .timer-box{text-align:center}
    .timer{font-size:52px;line-height:1;font-weight:900;margin:18px 0 12px}
    .mode-row,.timer-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
    .mode-row button.active{background:#2f2d2a;color:#fff}
    .timer-actions{margin-top:14px}
    .preset-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;color:var(--muted);font-size:13px;flex-wrap:wrap}
    .preset-row input{width:64px;padding:7px 8px;border:1px solid var(--line);border-radius:10px;text-align:center}
    .progress{height:10px;background:#f2ede7;border-radius:999px;overflow:hidden;margin-top:14px}
    .progress>div{height:100%;background:linear-gradient(90deg,var(--accent),#ffc58f);width:0%}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .stat{background:#fffaf5;border:1px solid var(--line);padding:10px;border-radius:14px;text-align:center}
    .stat b{display:block;font-size:20px}
    .stat span{font-size:11px;color:var(--muted)}
    .task-form{display:grid;grid-template-columns:1fr auto;gap:8px}
    .task-form input{padding:10px 12px;border:1px solid var(--line);border-radius:12px;outline:none}
    .task-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;max-height:205px;overflow:auto}
    .task{display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid var(--line);border-radius:12px}
    .task.done .task-text{text-decoration:line-through;color:#9b958e}
    .task-text{flex:1;min-width:0;overflow-wrap:anywhere}
    .task small{color:var(--muted)}
    .task button{padding:5px 8px;border-radius:8px;font-size:12px}
    .reward-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .reward-head small{color:var(--muted)}
    .dog-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:12px}
    .dog{aspect-ratio:1;border-radius:16px;border:1px solid var(--line);background:#fffaf5;display:grid;place-items:center;position:relative;overflow:hidden}
    .dog.locked{filter:grayscale(1);opacity:.28}
    .dog .emoji{font-size:30px}
    .dog .badge{position:absolute;right:4px;bottom:4px;font-size:9px;background:#2f2d2a;color:#fff;border-radius:8px;padding:2px 5px}
    .milestone{margin-top:10px;padding:10px 12px;border-radius:12px;background:#fff7d8;border:1px solid #f1dfa4;font-size:13px}
    .footer-note{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
    .toast{
      position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
      background:#2f2d2a;color:#fff;padding:11px 16px;border-radius:12px;opacity:0;
      pointer-events:none;transition:.25s;z-index:50
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .loading{padding:60px 20px;text-align:center;color:var(--muted);grid-column:1/-1}
    @media(max-width:1050px){.grid{grid-template-columns:1fr}.dog-grid{grid-template-columns:repeat(7,1fr)}}
    @media(max-width:780px){.board{grid-template-columns:1fr}.app{padding:16px}.dog-grid{grid-template-columns:repeat(5,1fr)}}
  </style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <h1>🐾 双人学习小狗番茄钟</h1>
      <p>房间 DOG2026 · Supabase 云端共享 · Realtime 实时同步</p>
    </div>
    <div class="status">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">正在连接…</span>
    </div>
  </div>

  <div id="gate" class="gate-wrap" style="display:none">
    <div class="gate">
      <div class="gate-dog">🐶</div>
      <h2>双人学习空间</h2>
      <p>请输入共享密码。验证通过后，这个浏览器会记住授权身份，下次打开可以直接进入。</p>
      <div class="room">房间：DOG2026</div>
      <input id="roomPassword" type="password" autocomplete="current-password"
             placeholder="输入共享密码"
             onkeydown="if(event.key==='Enter')joinRoom()">
      <button id="joinBtn" class="primary" onclick="joinRoom()">进入学习空间</button>
      <div id="gateError" class="gate-error"></div>
    </div>
  </div>

  <div id="board" class="board">
    <div class="loading">正在检查访问权限…</div>
  </div>

  <div id="footer" class="footer-note" style="display:none">
    计时器秒数只保存在当前设备；任务、统计与小狗进度保存在 Supabase 云端。
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://afbrhqepoecpreozoqvx.supabase.co";
const SUPABASE_KEY = "sb_publishable_Gx3fNAg2V0Sgq9OQ59Y8yQ_fRCHOVcB";
const ROOM_CODE = "DOG2026";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DOGS = [
  ["🐶","奶油"],["🐕","柴柴"],["🐩","卷卷"],["🦮","金金"],["🐕‍🦺","勇勇"],
  ["🐶","豆豆"],["🐕","可可"],["🐩","棉花"],["🦮","布丁"],["🐕‍🦺","星星"],
  ["🐶","团子"],["🐕","麦麦"],["🐩","雪球"],["🦮","柚子"],["🐕‍🦺","露露"]
];

let room = null;
let roomId = null;
let profiles = [];
let tasks = [];
let timers = {};
let realtimeChannel = null;
let refreshTimer = null;

function h(s=""){
  return String(s).replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
  }[m]));
}

function fmt(sec){
  sec=Math.max(0,Math.ceil(sec));
  return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
}

function earnedDogs(p){
  return Math.min(
    DOGS.length,
    Math.floor((p.completed_sessions||0)/Math.max(1,p.reward_every||3))
  );
}

function nextRewardText(p){
  const every=Math.max(1,p.reward_every||3);
  const earned=earnedDogs(p);

  if(earned>=DOGS.length) return "你已经收集完全部小狗！";

  const next=(Math.floor((p.completed_sessions||0)/every)+1)*every;
  return `再完成 ${next-(p.completed_sessions||0)} 个专注番茄，即可解锁下一只小狗。`;
}

function setStatus(type,text){
  const d=document.getElementById("statusDot");
  const t=document.getElementById("statusText");
  d.className="dot "+type;
  t.textContent=text;
}

function showGate(message=""){
  document.getElementById("gate").style.display="grid";
  document.getElementById("board").style.display="none";
  document.getElementById("footer").style.display="none";
  document.getElementById("gateError").textContent=message;
  setStatus("","等待密码");
}

function showApp(){
  document.getElementById("gate").style.display="none";
  document.getElementById("board").style.display="grid";
  document.getElementById("footer").style.display="block";
}

async function ensureAnonymousSession(){
  const {data:{session},error}=await db.auth.getSession();
  if(error) throw error;

  if(session) return session;

  const {data,error:signError}=await db.auth.signInAnonymously();
  if(signError) throw signError;

  return data.session;
}

async function findExistingMembership(){
  const {data,error}=await db
    .from("room_members")
    .select("room_id")
    .limit(1);

  if(error) throw error;
  return data && data.length ? data[0].room_id : null;
}

async function joinRoom(){
  const input=document.getElementById("roomPassword");
  const btn=document.getElementById("joinBtn");
  const err=document.getElementById("gateError");
  const password=input.value.trim();

  if(!password){
    err.textContent="请输入共享密码。";
    return;
  }

  btn.disabled=true;
  btn.textContent="正在验证…";
  err.textContent="";

  try{
    const {data,error}=await db.rpc("join_room",{
      p_room_code:ROOM_CODE,
      p_access_token:password
    });

    if(error) throw error;

    roomId=data;
    input.value="";

    await loadAll();
    subscribeRealtime();

  }catch(e){
    console.error(e);
    const msg=String(e.message||e);

    if(msg.includes("Invalid room password")){
      err.textContent="密码不正确。";
    }else if(msg.includes("Room not found")){
      err.textContent="找不到这个房间。";
    }else{
      err.textContent="验证失败："+msg;
    }

  }finally{
    btn.disabled=false;
    btn.textContent="进入学习空间";
  }
}

async function boot(){
  try{
    setStatus("","正在建立安全会话…");

    await ensureAnonymousSession();

    const existing=await findExistingMembership();

    if(existing){
      roomId=existing;
      await loadAll();
      subscribeRealtime();
    }else{
      showGate();
    }

  }catch(e){
    console.error(e);
    setStatus("error","初始化失败");

    document.getElementById("board").innerHTML=
      `<div class="loading">
        初始化失败：${h(e.message||e)}
        <br><br>
        请确认 Supabase 已开启 Anonymous Sign-Ins。
      </div>`;
  }
}

async function loadAll(){
  try{
    if(!roomId) throw new Error("没有房间授权");

    const r=await db
      .from("rooms")
      .select("*")
      .eq("id",roomId)
      .single();

    if(r.error) throw r.error;
    room=r.data;

    const p=await db
      .from("profiles")
      .select("*")
      .eq("room_id",roomId)
      .order("slot");

    if(p.error) throw p.error;
    profiles=p.data||[];

    const ts=await db
      .from("tasks")
      .select("*")
      .eq("room_id",roomId)
      .order("created_at",{ascending:false});

    if(ts.error) throw ts.error;
    tasks=ts.data||[];

    showApp();
    setStatus("online","已授权 · 云端已连接");
    render();

  }catch(e){
    console.error(e);
    setStatus("error","读取失败");

    document.getElementById("board").style.display="grid";
    document.getElementById("board").innerHTML=
      `<div class="loading">无法读取房间数据：${h(e.message||e)}</div>`;
  }
}

function timerFor(p){
  if(!timers[p.id]){
    const key="dog-timer-"+p.id;
    let saved=null;

    try{
      saved=JSON.parse(localStorage.getItem(key));
    }catch(e){}

    timers[p.id]=saved||{
      mode:"focus",
      remaining:(p.focus_minutes||25)*60,
      running:false,
      endAt:null
    };
  }

  return timers[p.id];
}

function saveTimer(p){
  localStorage.setItem("dog-timer-"+p.id,JSON.stringify(timerFor(p)));
}

function userHTML(p){
  const t=timerFor(p);
  const total=(t.mode==="focus"?(p.focus_minutes||25):(p.break_minutes||5))*60;
  const pct=total?(1-t.remaining/total)*100:0;
  const myTasks=tasks.filter(x=>x.profile_id===p.id);

  return `
  <section class="user">
    <div class="user-head">
      <div class="identity">
        <div class="avatar">${h(p.avatar||"🐶")}</div>
        <div class="name-wrap">
          <input value="${h(p.display_name)}"
                 onchange="renameUser('${p.id}',this.value)"
                 aria-label="用户名">
          <div class="sub">${p.slot==="A"?"左侧用户":"右侧用户"} · 云端共享</div>
        </div>
      </div>
      <button onclick="cycleAvatar('${p.id}')">换头像</button>
    </div>

    <div class="grid">

      <div class="card timer-box">
        <h3>番茄钟</h3>

        <div class="mode-row">
          <button class="${t.mode==="focus"?"active":""}"
                  onclick="setMode('${p.id}','focus')">专注</button>

          <button class="${t.mode==="break"?"active":""}"
                  onclick="setMode('${p.id}','break')">休息</button>
        </div>

        <div class="timer" id="timer-${p.id}">
          ${fmt(t.remaining)}
        </div>

        <div class="progress">
          <div id="progress-${p.id}" style="width:${pct}%"></div>
        </div>

        <div class="timer-actions">
          <button class="primary" onclick="toggleTimer('${p.id}')">
            ${t.running?"暂停":"开始"}
          </button>

          <button onclick="resetTimer('${p.id}')">
            重置
          </button>

          <button class="green" onclick="finishNow('${p.id}')">
            完成本轮
          </button>
        </div>

        <div class="preset-row">
          专注
          <input type="number"
                 min="1"
                 max="180"
                 value="${p.focus_minutes||25}"
                 onchange="setMinutes('${p.id}','focus_minutes',this.value)">
          分钟

          · 休息

          <input type="number"
                 min="1"
                 max="60"
                 value="${p.break_minutes||5}"
                 onchange="setMinutes('${p.id}','break_minutes',this.value)">
          分钟
        </div>
      </div>

      <div class="card">
        <h3>学习统计</h3>

        <div class="stats">
          <div class="stat">
            <b>${p.completed_sessions||0}</b>
            <span>完成番茄</span>
          </div>

          <div class="stat">
            <b>${p.focused_minutes||0}</b>
            <span>专注分钟</span>
          </div>

          <div class="stat">
            <b>${earnedDogs(p)}</b>
            <span>已收集小狗</span>
          </div>
        </div>

        <div class="milestone">
          ${nextRewardText(p)}
        </div>

        <div class="preset-row" style="justify-content:flex-start">
          每完成
          <input type="number"
                 min="1"
                 max="20"
                 value="${p.reward_every||3}"
                 onchange="setRewardEvery('${p.id}',this.value)">
          个专注番茄，解锁 1 只小狗
        </div>
      </div>

      <div class="card">
        <h3>学习任务</h3>

        <div class="task-form">
          <input id="task-input-${p.id}"
                 placeholder="例如：背单词 30 个"
                 onkeydown="if(event.key==='Enter')addTask('${p.id}')">

          <button class="primary"
                  onclick="addTask('${p.id}')">
            添加
          </button>
        </div>

        <div class="task-list">

          ${myTasks.length
            ? myTasks.map(x=>`
              <div class="task ${x.completed?"done":""}">
                <input type="checkbox"
                       ${x.completed?"checked":""}
                       onchange="toggleTask('${x.id}',${!x.completed})">

                <div class="task-text">
                  ${h(x.text)}
                </div>

                <small>${x.completed?"完成":"进行中"}</small>

                <button onclick="deleteTask('${x.id}')">
                  删除
                </button>
              </div>
            `).join("")
            : `<div class="sub">还没有任务。添加一个学习任务。</div>`
          }

        </div>
      </div>

      <div class="card">
        <div class="reward-head">
          <h3 style="margin:0">小狗收藏册</h3>
          <small>${earnedDogs(p)}/${DOGS.length}</small>
        </div>

        <div class="dog-grid">
          ${DOGS.map((d,di)=>{
            const unlocked=di<earnedDogs(p);

            return `
              <div class="dog ${unlocked?"":"locked"}"
                   title="${unlocked?d[1]:"未解锁"}">
                <div class="emoji">${d[0]}</div>
                <div class="badge">${unlocked?d[1]:"🔒"}</div>
              </div>
            `;
          }).join("")}
        </div>
      </div>

    </div>
  </section>`;
}

function render(){
  document.getElementById("board").innerHTML=
    profiles.length
      ? profiles.map(userHTML).join("")
      : `<div class="loading">房间里没有找到用户。</div>`;

  updateDynamic();
}

function profileById(id){
  return profiles.find(x=>x.id===id);
}

async function renameUser(id,value){
  const v=value.trim();
  if(!v) return;

  const {error}=await db
    .from("profiles")
    .update({display_name:v})
    .eq("id",id);

  if(error){
    toast("修改名字失败："+error.message);
  }
}

async function cycleAvatar(id){
  const p=profileById(id);
  const icons=["🐶","🐕","🐩","🦮","🐕‍🦺","🐾"];

  const next=
    icons[(icons.indexOf(p.avatar)+1+icons.length)%icons.length];

  const {error}=await db
    .from("profiles")
    .update({avatar:next})
    .eq("id",id);

  if(error){
    toast("修改头像失败："+error.message);
  }else{
    await loadAll();
  }
}

function setMode(id,mode){
  const p=profileById(id);
  const t=timerFor(p);

  t.running=false;
  t.endAt=null;
  t.mode=mode;

  t.remaining=
    (mode==="focus"
      ? (p.focus_minutes||25)
      : (p.break_minutes||5)
    )*60;

  saveTimer(p);
  render();
}

function toggleTimer(id){
  const p=profileById(id);
  const t=timerFor(p);

  if(t.running){

    t.remaining=
      Math.max(
        0,
        Math.ceil((t.endAt-Date.now())/1000)
      );

    t.running=false;
    t.endAt=null;

  }else{

    if(t.remaining<=0){
      t.remaining=
        (t.mode==="focus"
          ? (p.focus_minutes||25)
          : (p.break_minutes||5)
        )*60;
    }

    t.running=true;
    t.endAt=Date.now()+t.remaining*1000;
  }

  saveTimer(p);
  render();
}

function resetTimer(id){
  const p=profileById(id);
  const t=timerFor(p);

  t.running=false;
  t.endAt=null;

  t.remaining=
    (t.mode==="focus"
      ? (p.focus_minutes||25)
      : (p.break_minutes||5)
    )*60;

  saveTimer(p);
  render();
}

async function finishNow(id){
  await completeRound(id);
}

async function completeRound(id){
  const p=profileById(id);
  const t=timerFor(p);
  const wasFocus=t.mode==="focus";

  t.running=false;
  t.endAt=null;

  if(wasFocus){

    const minutes=p.focus_minutes||25;

    const {error:sErr}=await db
      .from("pomodoro_sessions")
      .insert({
        room_id:p.room_id,
        profile_id:p.id,
        duration_minutes:minutes
      });

    if(sErr){
      toast("保存番茄记录失败："+sErr.message);
      return;
    }

    const {error:pErr}=await db
      .from("profiles")
      .update({
        completed_sessions:(p.completed_sessions||0)+1,
        focused_minutes:(p.focused_minutes||0)+minutes
      })
      .eq("id",p.id);

    if(pErr){
      toast("更新统计失败："+pErr.message);
      return;
    }

    t.mode="break";
    t.remaining=(p.break_minutes||5)*60;

    toast(`${p.display_name} 完成了一个专注番茄`);

  }else{

    t.mode="focus";
    t.remaining=(p.focus_minutes||25)*60;

    toast(`${p.display_name} 休息结束`);
  }

  saveTimer(p);
  await loadAll();
}

async function setMinutes(id,key,value){
  const p=profileById(id);
  const max=key==="focus_minutes"?180:60;

  const n=
    Math.max(
      1,
      Math.min(max,parseInt(value)||1)
    );

  const {error}=await db
    .from("profiles")
    .update({[key]:n})
    .eq("id",id);

  if(error){
    toast("设置失败："+error.message);
    return;
  }

  const t=timerFor(p);

  if(
    (key==="focus_minutes"&&t.mode==="focus") ||
    (key==="break_minutes"&&t.mode==="break")
  ){
    t.running=false;
    t.endAt=null;
    t.remaining=n*60;
    saveTimer(p);
  }

  await loadAll();
}

async function setRewardEvery(id,value){
  const n=
    Math.max(
      1,
      Math.min(20,parseInt(value)||1)
    );

  const {error}=await db
    .from("profiles")
    .update({reward_every:n})
    .eq("id",id);

  if(error){
    toast("设置失败："+error.message);
  }else{
    await loadAll();
  }
}

async function addTask(profileId){
  const p=profileById(profileId);
  const input=document.getElementById(`task-input-${profileId}`);
  const text=input.value.trim();

  if(!text) return;

  input.value="";

  const {error}=await db
    .from("tasks")
    .insert({
      room_id:p.room_id,
      profile_id:p.id,
      text
    });

  if(error){
    toast("添加任务失败："+error.message);
  }else{
    await loadAll();
  }
}

async function toggleTask(taskId,completed){
  const {error}=await db
    .from("tasks")
    .update({completed})
    .eq("id",taskId);

  if(error){
    toast("更新任务失败："+error.message);
  }else{
    await loadAll();
  }
}

async function deleteTask(taskId){
  const {error}=await db
    .from("tasks")
    .delete()
    .eq("id",taskId);

  if(error){
    toast("删除任务失败："+error.message);
  }else{
    await loadAll();
  }
}

function updateDynamic(){
  profiles.forEach(p=>{
    const t=timerFor(p);

    if(t.running&&t.endAt){

      t.remaining=
        Math.max(
          0,
          Math.ceil((t.endAt-Date.now())/1000)
        );

      const total=
        (t.mode==="focus"
          ? (p.focus_minutes||25)
          : (p.break_minutes||5)
        )*60;

      const el=
        document.getElementById(`timer-${p.id}`);

      const bar=
        document.getElementById(`progress-${p.id}`);

      if(el){
        el.textContent=fmt(t.remaining);
      }

      if(bar){
        bar.style.width=
          `${Math.min(
            100,
            Math.max(
              0,
              (1-t.remaining/total)*100
            )
          )}%`;
      }

      if(t.remaining<=0){
        saveTimer(p);
        completeRound(p.id);
      }
    }
  });
}

function toast(msg){
  const e=document.getElementById("toast");
  e.textContent=msg;
  e.classList.add("show");

  setTimeout(
    ()=>e.classList.remove("show"),
    2600
  );
}

function subscribeRealtime(){
  if(realtimeChannel) return;

  realtimeChannel=
    db.channel("dog-room-"+ROOM_CODE)

      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"profiles",
          filter:`room_id=eq.${roomId}`
        },
        ()=>scheduleRefresh()
      )

      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"tasks",
          filter:`room_id=eq.${roomId}`
        },
        ()=>scheduleRefresh()
      )

      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"pomodoro_sessions",
          filter:`room_id=eq.${roomId}`
        },
        ()=>scheduleRefresh()
      )

      .subscribe(status=>{
        if(status==="SUBSCRIBED"){
          setStatus("online","已授权 · 实时同步");
        }
      });
}

function scheduleRefresh(){
  clearTimeout(refreshTimer);

  refreshTimer=
    setTimeout(
      ()=>loadAll(),
      180
    );
}

setInterval(
  ()=>{
    updateDynamic();
    profiles.forEach(saveTimer);
  },
  250
);

document.addEventListener(
  "visibilitychange",
  ()=>{
    if(!document.hidden&&roomId){
      updateDynamic();
      loadAll();
    }
  }
);

boot();
</script>
